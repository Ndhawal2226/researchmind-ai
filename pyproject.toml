[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind-ai"
version = "0.1.0"
description = "Evidence-grounded scientific paper RAG assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.40,<2",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-xai",
  "langgraph",
  "pinecone",
  "sentence-transformers",
  "pymupdf",
  "pydantic-settings>=2",
  "python-dotenv>=1",
  "tenacity>=8",
  "structlog>=24",
  "rank-bm25",
  "tiktoken",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
